<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PathWise - Login</title>

    <link rel="stylesheet" href="stylelogin.css">

</head>


<body>

    <div class="auth-container">

        <div class="auth-box">

            <!-- Logo -->

            <h1 class="auth-logo">
                Path<span>Wise</span>
            </h1>


            <!-- Heading -->

            <h2>Welcome Back!</h2>

            <p class="auth-text">
                Login to continue your PathWise journey.
            </p>


            <!-- Login Form -->

            <form>

                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="auth-button">

                    Login

                </button>

            </form>


            <!-- Register -->

            <p class="switch-text">

                Don't have an account?

                <a href="registration.html">
                    Register
                </a>

            </p>

        </div>

    </div>

</body>

</html>
